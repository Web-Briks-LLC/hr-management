# Docker Compose groups these services as HR Management (hr-management).
name: hr-management
services:
  mongo:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks: [local]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks: [local]
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
    init: true
    env_file: server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/hr-management-local?replicaSet=rs0&directConnection=true
      SMTP_HOST: mailpit
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./server/src:/app/src
      - ./server/tsconfig.json:/app/tsconfig.json:ro
    networks: [local]
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        APP: client
    init: true
    env_file: client/.env.local
    command: [npm, run, dev, --, --hostname, 0.0.0.0, --port, "3000"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    networks: [local]
    depends_on:
      server:
        condition: service_healthy
  payment:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        APP: payment
    init: true
    env_file: payment/.env.local
    environment:
      MONGO_URI: mongodb://mongo:27017/hr-management-local?replicaSet=rs0&directConnection=true
    command: [npm, run, dev, --, --hostname, 0.0.0.0, --port, "3001"]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./payment/src:/app/src
      - ./payment/public:/app/public
    networks: [local]
    depends_on:
      mongo:
        condition: service_healthy
      server:
        condition: service_healthy
networks:
  # Published ports bind only to localhost; integrations use local/test credentials.
  local: {}
volumes:
  mongo-data:
